{% for file in files %}
<tr>
  <td>{{ file.original_name }}</td>
  <td>{{ file.upload_time }}</td>
  <td>{{ file.estimated_duration }}</td>
  <td>
    <a href="{{ url_for('player', file_id=file.id) }}" class="btn btn-primary btn-sm">Play</a>
    <a href="{{ url_for('summarize', file_id=file.id) }}" class="btn btn-info btn-sm">Summarize</a>
    <a href="{{ url_for('delete_file', file_id=file.id) }}" class="btn btn-danger btn-sm">Delete</a>
  </td>
</tr>
{% endfor %}
