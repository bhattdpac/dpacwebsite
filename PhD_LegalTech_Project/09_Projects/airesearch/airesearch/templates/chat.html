<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Paper - AI Research Assistant</title>
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex">
    <aside class="w-64 bg-white shadow-md p-6 flex flex-col">
        <h1 class="text-2xl font-bold mb-8">AI Assistant</h1>
        <nav class="flex flex-col gap-4">
            <a href="/" class="hover:text-blue-600">Upload PDFs</a>
            <a href="/dashboard" class="hover:text-blue-600">All Files</a>
            <a href="#" class="hover:text-blue-600">Profile</a>
        </nav>
    </aside>
    <main class="flex-1 p-10">
        <div class="max-w-xl mx-auto bg-white rounded-lg shadow p-8">
            <h2 class="text-xl font-bold mb-4">Chat with Paper</h2>
            <form method="post" class="mb-4">
                <label class="block mb-2 font-semibold">Ask a question about this paper:</label>
                <input type="text" name="question" value="{{ question }}" class="w-full border rounded p-2 mb-2" required>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Ask</button>
            </form>
            {% if answer %}
            <div class="mt-4">
                <div class="font-semibold mb-1">Answer:</div>
                <div class="bg-gray-100 rounded p-4 text-gray-700">{{ answer }}</div>
            </div>
            {% endif %}
            <a href="/dashboard" class="text-blue-600 hover:underline mt-4 inline-block">Back to Dashboard</a>
        </div>
    </main>
</body>
</html>
