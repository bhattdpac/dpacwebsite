<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Audio - AI Research Assistant</title>
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex">
    <aside class="w-64 bg-white shadow-md p-6 flex flex-col">
        <h1 class="text-2xl font-bold mb-8">AI Assistant</h1>
        <nav class="flex flex-col gap-4">
            <a href="/" class="hover:text-blue-600">Upload PDFs</a>
            <a href="/dashboard" class="hover:text-blue-600">All Files</a>
            <a href="#" class="hover:text-blue-600">Profile</a>
        </nav>
    </aside>
    <main class="flex-1 p-10">
        <div class="max-w-xl mx-auto bg-white rounded-lg shadow p-8">
            <h2 class="text-xl font-bold mb-4">Listen to Paper</h2>
            <audio controls class="w-full mb-4" src="/static/audio/{{ audio }}"></audio>
            <div class="mb-2 font-semibold">Summary</div>
            <div class="bg-gray-100 rounded p-4 text-gray-700">{{ summary }}</div>
        </div>
    </main>
</body>
</html>
