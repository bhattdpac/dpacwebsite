<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metadata - AI Research Assistant</title>
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex">
    <aside class="w-64 bg-white shadow-md p-6 flex flex-col">
        <h1 class="text-2xl font-bold mb-8">AI Assistant</h1>
        <nav class="flex flex-col gap-4">
            <a href="/" class="hover:text-blue-600">Upload PDFs</a>
            <a href="/dashboard" class="hover:text-blue-600">All Files</a>
            <a href="#" class="hover:text-blue-600">Profile</a>
        </nav>
    </aside>
    <main class="flex-1 p-10">
        <div class="max-w-xl mx-auto bg-white rounded-lg shadow p-8">
            <h2 class="text-xl font-bold mb-4">Paper Metadata</h2>
            <div class="mb-4">
                <div class="font-semibold">Objectives</div>
                <div class="bg-gray-100 rounded p-2 mb-2">{{ metadata.objectives }}</div>
                <div class="font-semibold">Findings</div>
                <div class="bg-gray-100 rounded p-2 mb-2">{{ metadata.findings }}</div>
                <div class="font-semibold">Contributions</div>
                <div class="bg-gray-100 rounded p-2 mb-2">{{ metadata.contributions }}</div>
                <div class="font-semibold">Limitations</div>
                <div class="bg-gray-100 rounded p-2 mb-2">{{ metadata.limitations }}</div>
            </div>
            <a href="/dashboard" class="text-blue-600 hover:underline">Back to Dashboard</a>
        </div>
    </main>
</body>
</html>
