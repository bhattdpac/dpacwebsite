<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Summary & Audio - AI Research Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex">
    <aside class="w-64 bg-white shadow-md flex flex-col">
        <div class="p-6 font-bold text-xl border-b">AI Research Assistant</div>
        <nav class="flex-1 p-4 space-y-4">
            <a href="/" class="block py-2 px-4 rounded hover:bg-gray-200">Upload PDFs</a>
            <a href="/dashboard" class="block py-2 px-4 rounded hover:bg-gray-200">All Files</a>
            <a href="#" class="block py-2 px-4 rounded hover:bg-gray-200">Profile</a>
        </nav>
    </aside>
    <main class="flex-1 p-10">
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-lg shadow-md p-8">
                <h1 class="text-2xl font-bold mb-6 text-gray-800">📝 Paper Summary</h1>
                
                {% if audio %}
                <div class="mb-8 bg-blue-50 rounded-lg p-6">
                    <h2 class="text-lg font-semibold mb-4 text-blue-800 flex items-center">
                        🎵 Audio Podcast
                    </h2>
                    <audio controls class="w-full" preload="metadata">
                        <source src="/audio/{{ audio }}" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                    <p class="text-sm text-gray-600 mt-2">
                        Listen to the AI-generated summary of this research paper.
                    </p>
                </div>
                {% endif %}
                
                <div class="bg-gray-50 rounded-lg p-6">
                    <h2 class="text-lg font-semibold mb-4 text-gray-800 flex items-center">
                        📋 AI Summary
                    </h2>
                    <div class="text-gray-700 leading-relaxed whitespace-pre-line">
                        {{ summary }}
                    </div>
                </div>
                
                <div class="mt-8 flex gap-4">
                    <a href="/dashboard" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
                        ← Back to Dashboard
                    </a>
                    <button onclick="window.print()" class="bg-gray-600 text-white px-6 py-2 rounded hover:bg-gray-700">
                        🖨️ Print Summary
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
