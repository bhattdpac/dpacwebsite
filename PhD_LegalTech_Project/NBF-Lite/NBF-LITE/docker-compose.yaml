version: '2'

networks:
  nbf:

services:
  # ----------------------------------------------------------------
  # Core Hyperledger Fabric Network
  # ----------------------------------------------------------------
  ca.example.com:
    image: hyperledger/fabric-ca:1.4.1
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.example.com
      - FABRIC_CA_SERVER_CA_CERTFILE=/etc/hyperledger/fabric-ca-server-config/ca.org1.example.com-cert.pem
      - FABRIC_CA_SERVER_CA_KEYFILE=/etc/hyperledger/fabric-ca-server-config/priv_sk
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./Admin-Backend-Server-Fabric/crypto-config/peerOrganizations/org1.example.com/ca/:/etc/hyperledger/fabric-ca-server-config
    container_name: ca.example.com
    networks:
      - nbf

  orderer.example.com:
    container_name: orderer.example.com
    image: hyperledger/fabric-orderer:1.4.1
    environment:
      - ORDERER_GENERAL_LOGLEVEL=debug
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    ports:
      - 7050:7050
    volumes:
        - ./Admin-Backend-Server-Fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
        - ./Admin-Backend-Server-Fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/:/var/hyperledger/orderer/tls
        - ./Admin-Backend-Server-Fabric/channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
    networks:
      - nbf

  peer0.org1.example.com:
    container_name: peer0.org1.example.com
    image: hyperledger/fabric-peer:1.4.1
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_LOGGING_PEER=debug
      - CORE_CHAINCODE_LOGGING_LEVEL=DEBUG
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/peer/
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=NBF-LITE_nbf
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb:5984
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 7051:7051
      - 7053:7053
    volumes:
        - /var/run/:/host/var/run/
        - ./Admin-Backend-Server-Fabric/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/etc/hyperledger/msp/peer
        - ./Admin-Backend-Server-Fabric/crypto-config/peerOrganizations/org1.example.com/users:/etc/hyperledger/msp/users
    depends_on:
      - orderer.example.com
      - couchdb
    networks:
      - nbf

  couchdb:
    container_name: couchdb
    image: hyperledger/fabric-couchdb:0.4.14
    ports:
      - "5984:5984"
    environment:
      DB_URL: http://localhost:5984/member_db
    networks:
      - nbf

  # ----------------------------------------------------------------
  # New ILDLM Application Services
  # ----------------------------------------------------------------
  ildlm_backend:
    container_name: ildlm_backend
    build:
      context: .
      dockerfile: ./ildlm_backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./Admin-Backend-Server-Fabric/crypto-config:/app/crypto-config
    depends_on:
      - peer0.org1.example.com
      - postgres
    networks:
      - nbf
    environment:
      - DATABASE_URL=postgresql://ildlm:changethisinproduction@postgres/ildlm_db

  # ----------------------------------------------------------------
  # New Database Service for ILDLM
  # ----------------------------------------------------------------
  postgres:
    image: postgres:13-alpine
    container_name: ildlm_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ildlm
      - POSTGRES_PASSWORD=changethisinproduction
      - POSTGRES_DB=ildlm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nbf

volumes:
  postgres_data:
